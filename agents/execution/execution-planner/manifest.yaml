id: EXE-001
name: Execution Agent
version: 1.0.0

description: >
  Turns approved recommendations into concrete actions through the
  integration layer. It proposes; the policy engine and a human decide. It
  executes only what has been approved.

module: agent.py

capabilities:
  - execution.plan
  - cms.draft

tools:
  - cms
  - memory

memory_scopes:
  - brand
  - mission

risk_level: medium

input_schema: ExecutionPlanInput
output_schema: ExecutionPlanOutput

# Creating an internal draft record changes nothing a visitor can see, so it is
# the only thing this agent may do without an approval. Everything that touches
# the live site is listed below and cannot be executed until a human approves.
autonomous_actions:
  - content.create

approval_required_for:
  - cms.create_draft
  - cms.update_draft
  - cms.publish
  - content.update
  - seo.metadata_update
  - seo.internal_link_add
  - seo.schema_update
  - seo.redirect_create

model_policy:
  reasoning: high
  temperature: 0.1
  deterministic_fallback: true

prompt: agents/execution/execution-planner
tags:
  - execution
