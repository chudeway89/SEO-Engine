[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-engine"
version = "0.1.0"
description = "Evidence-first agentic SEO operating system"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
