[project]
name = "seo-engine"
version = "0.1.0"
description = "SEO Engine — an agentic search, content and growth operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "cryptography>=43.0",
    "email-validator>=2.2",
    "orjson>=3.10",
]

[project.optional-dependencies]
worker = [
    "temporalio>=1.8",
]
browser = [
    "playwright>=1.48",
]
llm = [
    "anthropic>=0.39",
]
storage = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "respx>=0.21",
]

[project.scripts]
seo-engine = "seo_engine.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The monorepo keeps the physical layout mandated by the Build Specification
# (apps/, packages/, agents/, integrations/, database/ ...).  All Python code
# lives under an implicit `seo_engine` namespace package that is assembled from
# several roots.  See docs/architecture/decisions.md (ADR-0001).
[tool.hatch.build.targets.wheel]
packages = [
    "packages/shared/seo_engine",
    "packages/schemas/seo_engine",
    "packages/domain/seo_engine",
    "packages/engines/seo_engine",
    "packages/observability/seo_engine",
    "packages/events/seo_engine",
    "packages/evidence/seo_engine",
    "packages/memory/seo_engine",
    "packages/knowledge/seo_engine",
    "packages/permissions/seo_engine",
    "packages/policies/seo_engine",
    "packages/prompts/seo_engine",
    "packages/agent-registry/seo_engine",
    "packages/agent-runtime/seo_engine",
    "packages/orchestration/seo_engine",
    "packages/workflows/seo_engine",
    "packages/integrations/seo_engine",
    "apps/api/seo_engine",
    "apps/worker/seo_engine",
]

# Editable installs need every namespace root on sys.path, not just the first.
dev-mode-dirs = [
    "packages/shared",
    "packages/schemas",
    "packages/domain",
    "packages/engines",
    "packages/observability",
    "packages/events",
    "packages/evidence",
    "packages/memory",
    "packages/knowledge",
    "packages/permissions",
    "packages/policies",
    "packages/prompts",
    "packages/agent-registry",
    "packages/agent-runtime",
    "packages/orchestration",
    "packages/workflows",
    "packages/integrations",
    "apps/api",
    "apps/worker",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "packages/shared",
    "packages/schemas",
    "packages/domain",
    "packages/engines",
    "packages/observability",
    "packages/events",
    "packages/evidence",
    "packages/memory",
    "packages/knowledge",
    "packages/permissions",
    "packages/policies",
    "packages/prompts",
    "packages/agent-registry",
    "packages/agent-runtime",
    "packages/orchestration",
    "packages/workflows",
    "packages/integrations",
    "apps/api",
    "apps/worker",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
markers = [
    "integration: requires a live PostgreSQL database",
    "security: security regression tests",
    "evaluation: agent evaluation tests against golden datasets",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["apps/web", ".venv", "database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012", "SIM108", "E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/shared:packages/schemas:packages/domain:packages/engines:packages/observability:packages/events:packages/evidence:packages/memory:packages/knowledge:packages/permissions:packages/policies:packages/prompts:packages/agent-registry:packages/agent-runtime:packages/orchestration:packages/workflows:packages/integrations:apps/api:apps/worker"
